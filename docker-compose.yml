version: '3'
services:
  vpn:
    image: mi-nordvpn-proxy
    container_name: nordvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    dns:
      - 103.86.96.100
      - 103.86.99.100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ovpn-data:/app/ovpn/config
    logging:
      driver: "json-file"
      options:
        max-size: 1m
    environment:
      - USERNAME=
      - PASSWORD=
      - COUNTRY=MX
#      - SERVER=mx110.nordvpn.com
      - LOCAL_N6ETWORK=192.168.1.0/24
    networks:
      - default
    ports:
      - 8118:8118
    restart: "no"

volumes:
  ovpn-data:
